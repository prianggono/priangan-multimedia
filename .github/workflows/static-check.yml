name: Static Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0 | sort -z)
      - name: Check loaded assets exist and are not duplicated
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')

          js_refs = re.findall(
              r'<script[^>]+src=["\'](js/[^"\']+\.js)(?:\?[^"\']*)?["\']',
              html,
              re.I,
          )
          css_refs = re.findall(
              r'<link[^>]+href=["\'](css/[^"\']+\.css)(?:\?[^"\']*)?["\']',
              html,
              re.I,
          )

          def validate(kind, refs):
              paths = [r.split('?', 1)[0] for r in refs]
              missing = [r for r in paths if not Path(r).exists()]
              if missing:
                  raise SystemExit(f'Missing {kind} files: ' + ', '.join(sorted(set(missing))))

              duplicates = sorted(path for path, count in Counter(paths).items() if count > 1)
              if duplicates:
                  raise SystemExit(f'Duplicate {kind} entrypoint references: ' + ', '.join(duplicates))

              print(f'Validated {len(paths)} {kind} entrypoint references.')

          validate('JavaScript', js_refs)
          validate('CSS', css_refs)
          PY
      - name: Check canonical frontend filenames
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r file; do
            base=$(basename "$file")
            case "$base" in
              *-fix.js|*-final.js|*-v2.js|*-canonical*.js|*-tidy*.css)
                echo "Legacy-style runtime filename found: $file"
                bad=1
                ;;
            esac
          done < <(find js css -type f \( -name '*.js' -o -name '*.css' \) | sort)
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo 'Canonical frontend filenames verified.'
      - name: Check removed layers stay removed
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            'customer-document-canonical.js'
            'invoice-header-image-final.css'
            'invoice-print-visibility-fix.css'
            'invoice-quotation-match.css'
            'quotation-info-invoice-match-final.css'
            'pmInvoicePreview'
          )
          for pattern in "${forbidden[@]}"; do
            if grep -RIn --exclude-dir=.git --exclude='*.md' --exclude='static-check.yml' "$pattern" .; then
              echo "Forbidden legacy reference found: $pattern"
              exit 1
            fi
          done
          echo 'Legacy Invoice layers verified absent.'
